<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Collegamento completato — Social Dashboard</title>
<!--
  Pagina di atterraggio dell'autorizzazione Instagram.

  Deve restare deliberatamente stupida: nessun router, nessun redirect,
  nessuno script che tocchi l'URL. E' l'app desktop a leggere il parametro
  `code` dalla barra degli indirizzi di questa finestra, quindi qualunque
  riscrittura lato client farebbe perdere il codice e il collegamento
  resterebbe appeso.

  Il codice non viene ne' mostrato ne' inviato da nessuna parte: resta
  nell'URL, che vive solo dentro la finestra dell'app.
-->
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: #0f1115; color: #e7e9ee;
    font: 15px/1.6 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 24px;
  }
  .card {
    max-width: 380px; text-align: center;
    background: #171a21; border: 1px solid #262a34;
    border-radius: 14px; padding: 32px 28px;
  }
  .mark {
    width: 46px; height: 46px; margin: 0 auto 16px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%; background: rgba(74, 222, 128, .16);
    color: #4ade80; font-size: 22px;
  }
  h1 { margin: 0 0 8px; font-size: 18px; }
  p { margin: 0; color: #9aa1ae; font-size: 14px; }
</style>
</head>
<body>
  <div class="card">
    <div class="mark">✓</div>
    <h1>Autorizzazione completata</h1>
    <p>Puoi chiudere questa finestra e tornare a Social Dashboard.</p>
  </div>
</body>
</html>
